# ============================================================
# NVIDIA GPU override — use ONLY on a host with an NVIDIA GPU
# and nvidia-container-toolkit configured in the Docker daemon.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# This switches ai-engine to the CUDA image and enables the
# nvidia runtime + device reservation.
# ============================================================

services:
  ai-engine:
    build:
      context: ./services/ai-engine
      dockerfile: Dockerfile
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all