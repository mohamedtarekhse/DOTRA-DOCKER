# PostgreSQL tuned for ACUSEEK 40-camera workload
# 64GB ECC RAM server -> shared_buffers = 16GB, effective_cache_size = 48GB

listen_addresses = '*'

# Memory
shared_buffers = 16GB
effective_cache_size = 48GB
maintenance_work_mem = 2GB
work_mem = 64MB

# WAL
wal_buffers = 64MB
max_wal_size = 8GB
min_wal_size = 2GB
checkpoint_completion_target = 0.9

# Connections
max_connections = 200

# Parallelism (Ryzen 9 5900X = 12 cores/24 threads)
max_parallel_workers = 12
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4
max_worker_processes = 16

# HNSW / vector
shared_preload_libraries = 'vector'

# Logging
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'none'

# Timezone
timezone = 'Africa/Cairo'

# Autovacuum
autovacuum = on
autovacuum_max_workers = 5
