# PostgreSQL tuned for ACUSEEK 90-camera workload.
# Safe defaults that boot on 32-64GB boxes. On the planned 64GB ECC server
# raise to: shared_buffers = 16GB, effective_cache_size = 48GB,
# maintenance_work_mem = 2GB, work_mem = 64MB.

listen_addresses = '*'

# Memory (safe defaults)
shared_buffers = 8GB
effective_cache_size = 24GB
maintenance_work_mem = 1GB
work_mem = 32MB

# WAL
wal_buffers = 32MB
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# Connections
max_connections = 100

# Parallelism (Ryzen 5900X = 12 cores / 24 threads)
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4
max_worker_processes = 12

# HNSW / vector
shared_preload_libraries = 'vector'

# Logging
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'none'

# Timezone
timezone = 'Africa/Cairo'

# Autovacuum
autovacuum = on
autovacuum_max_workers = 5
