# Local LAN entry point for factory guards.
# Access via http://192.168.10.50  (unified — no port numbers)
# Remote/cloud access is handled separately by Cloudflare Tunnel.

# Dashboard UI
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://dashboard:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket support (live dashboard events)
    location /ws {
        proxy_pass http://dashboard:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # FastAPI backend routed under /api/
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO console (object storage admin)
    location /minio-console/ {
        proxy_pass http://minio:9001/;
        proxy_set_header Host $host;
    }

    # Static media served at line speed from disk (snapshots, crops)
    location /media/ {
        alias /media/;
        add_header Cache-Control "public, max-age=86400";
    }
}
