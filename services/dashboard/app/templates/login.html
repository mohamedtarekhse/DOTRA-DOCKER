<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACUSEEK — Sign in</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="login-brand"><span>🔎</span> ACUSEEK</div>
        <p class="login-sub">Factory Monitoring — sign in to continue</p>
        {% if error %}
        <div class="msg msg-err">Invalid username or password.</div>
        {% endif %}
        <form method="post" action="/login" class="form-group" style="gap:.6rem">
            <div class="form-group">
                <label class="label" for="username">Username</label>
                <input class="input" id="username" name="username" type="text" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label class="label" for="password">Password</label>
                <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-emphasis" type="submit" style="margin-top:.4rem">Sign in</button>
        </form>
    </div>
</div>
</body>
</html>
