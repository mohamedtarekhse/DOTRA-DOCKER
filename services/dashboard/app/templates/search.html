{% extends "base.html" %}
{% block title %}Search{% endblock %}
{% block page_title %}Image Search</h1><span class="count">AcuSeek Text-to-Image</span>{% endblock %}
{% block content %}

<div class="card">
    <div class="card-body">
        <form class="form-row"
              hx-get="/api/search-results"
              hx-target="#search-results"
              hx-trigger="submit">
            <div class="form-group" style="flex:1">
                <input class="input" name="q" type="text"
                       placeholder="Describe what you're looking for — e.g. red forklift near loading dock, person in yellow vest…"
                       value="{{ q }}"
                       style="font-size:1rem;padding:.6rem 1rem" required>
            </div>
            <button class="btn btn-emphasis" type="submit" style="padding:.6rem 1.5rem">Search</button>
        </form>
    </div>
</div>

<div id="search-results" class="search-grid" style="margin-top:1rem">
    <div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--fiori-text-hint)">
        Type a description to search surveillance snapshots.
    </div>
</div>

{% endblock %}
