<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACUSEEK — {% block title %}Factory Security{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="/static/css/styles.css">
    <script defer src="/static/js/app.js"></script>
</head>
<body>
    <!-- Shell bar -->
    <header class="fiori-shell">
        <div class="shell-left">
            <a href="/" class="shell-product" style="color:#fff;text-decoration:none">
                <span>🔎</span>
                <span>ACUSEEK<span class="prod-sub"> Factory Security</span></span>
            </a>
        </div>

        <div class="shell-center">
            <div class="shell-search" id="shell-search">
                <input id="global-search" type="text" placeholder="Search plates, persons, or images…"
                       autocomplete="off">
                <span class="search-icon">⌕</span>
                <div class="shell-search-dropdown" id="search-dd"></div>
            </div>
        </div>

        <div class="shell-right">
            <span id="sys-status" class="shell-icon" title="System status">●</span>
            <button class="shell-icon" id="alert-bell" title="Alerts" onclick="location.href='/alerts'">🔔
                <span class="badge" id="alert-badge">0</span>
            </button>
            <div class="user-chip">
                <span class="avatar">A</span>
                <span>admin</span>
            </div>
            <form method="post" action="/logout">
                <button class="btn-signout" type="submit">Sign out</button>
            </form>
        </div>
    </header>

    <!-- Nav tabs -->
    <nav class="fiori-tabs">
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
        <a href="/gates" class="{% if request.url.path == '/gates' %}active{% endif %}">Gates</a>
        <a href="/vehicles" class="{% if request.url.path == '/vehicles' %}active{% endif %}">Vehicles</a>
        <a href="/preapprovals" class="{% if request.url.path == '/preapprovals' %}active{% endif %}">Pre-Approvals</a>
        <a href="/persons" class="{% if request.url.path == '/persons' %}active{% endif %}">Persons</a>
        <a href="/alerts" class="{% if request.url.path == '/alerts' %}active{% endif %}">Alerts</a>
        <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">Settings</a>
    </nav>

    <main class="fiori-main">
        <div class="page-top">
            <h1 class="page-heading">{% block page_title %}{% endblock %}</h1>
        </div>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
