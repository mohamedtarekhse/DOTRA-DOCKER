<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACUSEEK — {% block title %}Factory Security{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script defer src="https://unpkg.com/alpinejs@3.13.10/dist/cdn.min.js"></script>
</head>
<body class="h-full">
<div class="flex h-full">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-slate-200 flex flex-col">
        <div class="p-5 text-xl font-bold text-white border-b border-slate-700">
            🔎 ACUSEEK
            <div class="text-xs font-normal text-slate-400">Factory Monitoring</div>
        </div>
        <nav class="flex-1 p-3 space-y-1">
            <a href="/" class="block px-4 py-2 rounded hover:bg-slate-800 transition">📊 Dashboard</a>
            <a href="/gates" class="block px-4 py-2 rounded hover:bg-slate-800 transition">🚧 Gates</a>
            <a href="/vehicles" class="block px-4 py-2 rounded hover:bg-slate-800 transition">🚗 Vehicles</a>
            <a href="/persons" class="block px-4 py-2 rounded hover:bg-slate-800 transition">👤 Persons</a>
            <a href="/search" class="block px-4 py-2 rounded hover:bg-slate-800 transition">🔎 Image Search</a>
            <a href="/alerts" class="block px-4 py-2 rounded hover:bg-slate-800 transition">🚨 Alerts</a>
            <a href="/settings" class="block px-4 py-2 rounded hover:bg-slate-800 transition">⚙️ Settings</a>
        </nav>
        <div class="p-4 text-xs text-slate-500">© 2026 ACUSEEK</div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 overflow-y-auto">
        <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
            <h1 class="text-lg font-semibold text-slate-800">{% block page_title %}{% endblock %}</h1>
            <div class="flex items-center gap-3">
                <span id="alert-badge" class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-sm">0 alerts</span>
            </div>
        </header>
        <div class="p-6">
            {% block content %}{% endblock %}
        </div>
    </main>
</div>
</body>
</html>
